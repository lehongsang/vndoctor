services:
  postgres:
    container_name: vndoctor_postgres
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: '${POSTGRES_USERNAME:-postgres}'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vndoctor}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PGTZ: ${DB_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '${POSTGRES_HOST_PORT:-5434}:5432'
    networks:
      - vndoctor
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h localhost -p 5432 -U ${POSTGRES_USERNAME:-postgres}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    container_name: vndoctor_redis
    image: redis:8-alpine
    restart: unless-stopped
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory-policy noeviction
    ports:
      - '${REDIS_PORT:-6378}:6379'
    volumes:
      - redisdata:/data
    networks:
      - vndoctor
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -h localhost -p 6379 -a ${REDIS_PASSWORD} ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  migrate:
    container_name: vndoctor_migrate
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Ho_Chi_Minh}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    command:
      [
        'node',
        './node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        './dist/database/data-source.js',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - vndoctor

  app:
    container_name: vndoctor_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:${APP_PORT:-3000}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Ho_Chi_Minh}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Server SDK talks to SeaweedFS inside the compose network:
      S3_ENDPOINT: http://seaweedfs-s3:8333
      # Presigned URLs must use a host the *browser* can open (not seaweedfs-s3):
      S3_EXTERNAL_URL: http://localhost:${SEAWEEDFS_FILER_S3_PORT:-8333}
      KAFKA_HOST: redpanda
      KAFKA_PORT: 29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-master:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:${APP_PORT:-3000}/api/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vndoctor
    volumes:
      - ./logs:/app/logs

  seed:
    container_name: vndoctor_seed
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ['manual-seed']
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Ho_Chi_Minh}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    command: ['node', './dist/database/seeds/run-seeds.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'
    networks:
      - vndoctor

  redpanda:
    container_name: vndoctor_redpanda
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    profiles: ['optional-observability']
    env_file:
      - .env
    command:
      - redpanda
      - start
      - --smp
      - '2'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --check=false
    ports:
      - '${KAFKA_PORT:-9092}:9092'
      - '29092:29092'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'rpk cluster health --brokers=localhost:29092 >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vndoctor

  opensearch:
    container_name: vndoctor_opensearch
    image: opensearchproject/opensearch:2.11.0
    profiles: ['optional-observability']
    env_file:
      - .env
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - 'OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m'
      - DISABLE_INSTALL_DEMO_CONFIG=false
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-admin}
      - plugins.security.disabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - '${OPENSEARCH_PORT:-9200}:9200'
      - '9600:9600'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:9200/_cluster/health >/dev/null || wget -qO- http://localhost:9200/_cluster/health >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vndoctor

  opensearch-dashboards:
    container_name: vndoctor_opensearch_dashboards
    image: opensearchproject/opensearch-dashboards:2.11.0
    profiles: ['optional-observability']
    env_file:
      - .env
    volumes:
      - ./fluent-bit/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
    ports:
      - '${DASHBOARDS_PORT:-5601}:5601'
    environment:
      - OPENSEARCH_HOSTS=https://opensearch:9200
      - OPENSEARCH_USERNAME=${OPENSEARCH_ADMIN_USER:-admin}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-admin}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:5601/api/status >/dev/null || wget -qO- http://localhost:5601/api/status >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vndoctor

  fluent-bit-shipper:
    container_name: vndoctor_fluent_bit_shipper
    image: fluent/fluent-bit:latest
    profiles: ['optional-observability']
    env_file:
      - .env
    volumes:
      - ./fluent-bit/shipper.conf:/fluent-bit/etc/fluent-bit.conf
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf
      - ./logs:/app/logs:ro
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep -q '[f]luent-bit'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vndoctor
    depends_on:
      - redpanda

  fluent-bit-indexer:
    container_name: vndoctor_fluent_bit_indexer
    image: fluent/fluent-bit:latest
    profiles: ['optional-observability']
    env_file:
      - .env
    volumes:
      - ./fluent-bit/indexer.conf:/fluent-bit/etc/fluent-bit.conf
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf
    environment:
      - OPENSEARCH_ADMIN_USER=${OPENSEARCH_ADMIN_USER:-admin}
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-admin}
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep -q '[f]luent-bit'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vndoctor
    depends_on:
      - redpanda
      - opensearch

  seaweedfs-master:
    container_name: vndoctor_seaweedfs_master
    image: chrislusf/seaweedfs:3.59
    env_file:
      - .env
    # Single process: master + volume + filer + S3 (no duplicate host port 8080).
    command: 'server -master -volume -filer -s3 -s3.config=/etc/seaweedfs/s3.json'
    ports:
      - '${SEAWEEDFS_MASTER_PORT:-9333}:9333'
      - '${SEAWEEDFS_VOLUME_PORT:-8080}:8080'
      - '${SEAWEEDFS_FILER_PORT:-8888}:8888'
      - '${SEAWEEDFS_FILER_S3_PORT:-8333}:8333'
    healthcheck:
      # Image ships wget + nc (BusyBox), not curl — curl would always fail.
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z -w 2 127.0.0.1 8333 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json
    networks:
      vndoctor:
        aliases:
          - seaweedfs
          - seaweedfs-s3

  kafka-ui:
    container_name: vndoctor_kafka_ui
    image: provectuslabs/kafka-ui:latest
    profiles: ['optional-observability']
    ports:
      - '${KAFKA_UI_PORT:-8088}:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - vndoctor
    depends_on:
      - redpanda

  dozzle:
    container_name: vndoctor_dozzle
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - '${DOZZLE_PORT:-9999}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
  redisdata:
  opensearch_data:
  seaweedfs_data:
  logs:

networks:
  vndoctor:
    driver: bridge
