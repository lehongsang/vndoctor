services:
  postgres:
    container_name: vndoctor_postgres
    image: postgres:18
    restart: unless-stopped
    cpus: '${POSTGRES_CPUS:-2.00}'
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-4g}
    memswap_limit: ${POSTGRES_MEMORY_SWAP_LIMIT:-4g}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    storage_opt:
      size: ${POSTGRES_STORAGE_LIMIT:-20G}
    env_file:
      - .env
    environment:
      POSTGRES_USER: '${POSTGRES_USERNAME:-postgres}'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vndoctor}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PGTZ: ${DB_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '${POSTGRES_HOST_PORT:-5434}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h localhost -p 5432 -U ${POSTGRES_USERNAME:-postgres}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      vndoctor:
        aliases:
          - vndoctor-postgres
    logging:
      driver: json-file
      options:
        max-size: ${POSTGRES_LOG_MAX_SIZE:-50m}
        max-file: '${POSTGRES_LOG_MAX_FILE:-3}'

  redis:
    container_name: vndoctor_redis
    image: redis:8-alpine
    restart: unless-stopped
    cpus: '${REDIS_CPUS:-0.50}'
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    memswap_limit: ${REDIS_MEMORY_SWAP_LIMIT:-512m}
    pids_limit: ${REDIS_PIDS_LIMIT:-128}
    storage_opt:
      size: ${REDIS_STORAGE_LIMIT:-2G}
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT:-6378}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -h localhost -p 6379 -a ${REDIS_PASSWORD} ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      vndoctor:
        aliases:
          - vndoctor-redis
    logging:
      driver: json-file
      options:
        max-size: ${REDIS_LOG_MAX_SIZE:-20m}
        max-file: '${REDIS_LOG_MAX_FILE:-3}'

  app:
    container_name: vndoctor_app
    image: vndoctor:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: '${APP_CPUS_LIMIT:-2.00}'
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
    memswap_limit: ${APP_MEMORY_SWAP_LIMIT:-2g}
    pids_limit: ${APP_PIDS_LIMIT:-256}
    storage_opt:
      size: ${APP_STORAGE_LIMIT:-5G}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Ho_Chi_Minh}
      DB_MIGRATIONS_RUN: 'false'
      POSTGRES_HOST: vndoctor-postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@vndoctor-redis:6379
      S3_ENDPOINT: http://seaweedfs:8333
      S3_EXTERNAL_URL: ${S3_EXTERNAL_URL:-http://localhost:${SEAWEEDFS_FILER_S3_PORT:-8333}}
    ports:
      - '${APP_PORT:-3000}:${APP_PORT:-3000}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:${APP_PORT:-3000}/api/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./logs:/app/logs
    networks:
      vndoctor: {}
      shared-storage: {}
    logging:
      driver: json-file
      options:
        max-size: ${APP_LOG_MAX_SIZE:-50m}
        max-file: '${APP_LOG_MAX_FILE:-5}'

  # One-shot schema job used by CI/CD before the running app is replaced.
  migration:
    image: vndoctor:${APP_IMAGE_TAG:-latest}
    restart: 'no'
    profiles:
      - migration
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Ho_Chi_Minh}
      DB_MIGRATIONS_RUN: 'false'
      POSTGRES_HOST: vndoctor-postgres
      POSTGRES_PORT: 5432
    command: npm run migration:run:prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      vndoctor: {}

  # One-shot seed job used by CI/CD
  seed:
    image: vndoctor:${APP_IMAGE_TAG:-latest}
    restart: 'no'
    profiles:
      - seed
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Ho_Chi_Minh}
      DB_MIGRATIONS_RUN: 'false'
      POSTGRES_HOST: vndoctor-postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@vndoctor-redis:6379
    command: npm run seed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      vndoctor: {}

  dozzle:
    container_name: vndoctor_dozzle
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - '${DOZZLE_PORT:-9999}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
  redisdata:

networks:
  vndoctor:
    driver: bridge
  shared-storage:
    external: true
    name: ${SHARED_STORAGE_NETWORK:-tmt-ilupet-api_nest_base}
