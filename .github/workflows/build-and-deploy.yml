name: CI/CD Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      PROJECT_DIR: ${{ secrets.PROJECT_DIR || '/root/tmt-navi-dev/tmt-navi-api' }}

    steps:
      - name: Update codebase
        run: |
          set -e
          cd "$PROJECT_DIR"

          # Force update codebase to matching commit on main
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - name: Build app image
        run: |
          set -e
          cd "$PROJECT_DIR"

          docker compose -f docker-compose.prod.yml build app

      - name: Cleanup old images after build
        run: |
          set -e

          docker image prune -f

      - name: Ensure Database is running and healthy
        run: |
          set -e
          cd "$PROJECT_DIR"

          docker compose -f docker-compose.prod.yml up -d postgres redis

      - name: Run database migrations before replacing the app
        run: |
          set -e
          cd "$PROJECT_DIR"

          docker compose -f docker-compose.prod.yml run --rm -e POSTGRES_HOST=navi-postgres -e POSTGRES_PORT=5432 migration

      - name: Run database seed
        run: |
          set -e
          cd "$PROJECT_DIR"

          docker compose -f docker-compose.prod.yml run --rm -e POSTGRES_HOST=navi-postgres -e POSTGRES_PORT=5432 seed

      - name: Deploy app container
        run: |
          set -e
          cd "$PROJECT_DIR"

          # Migrations and seeds were validated above, so recreating the application is now safe.
          docker compose -f docker-compose.prod.yml up -d --no-build --force-recreate app

      - name: Check deployed services
        run: |
          set -e
          cd "$PROJECT_DIR"

          docker compose -f docker-compose.prod.yml ps

      - name: Health check
        run: |
          set -e
          cd "$PROJECT_DIR"

          APP_PORT="$(
            grep -E '^APP_PORT=' .env 2>/dev/null \
              | tail -n 1 \
              | cut -d '=' -f2- \
              | tr -d '\r' \
              | sed -e "s/^[\"']//" -e "s/[\"']$//"
          )"
          APP_PORT="${APP_PORT:-3000}"

          if [ -f .env ]; then
            echo "Checking app health on port $APP_PORT."
          fi

          for attempt in $(seq 1 12); do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/api/health"; then
              exit 0
            fi

            echo "Health check attempt $attempt failed; retrying in 5 seconds..."
            sleep 5
          done

          echo "Health check failed after 12 attempts."
          exit 1

      - name: Cleanup old images after deploy
        run: |
          set -e

          docker image prune -f
          docker builder prune -f --filter until=24h

      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
          status: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        if: always()
